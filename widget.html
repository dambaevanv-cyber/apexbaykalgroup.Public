<script>
  // Названия страховых компаний иногда обрезаются многоточием внутри
  // Shadow DOM виджета. Внешние CSS-стили туда не попадают, поэтому
  // пытаемся вставить стиль прямо в shadowRoot через JS — сработает,
  // только если Shadow DOM открытый (mode: "open").
  (function(){
    var overrideCSS = `
      * { white-space: normal !important; }
      h1, h2, h3, h4, h5, h6,
      [class*="name" i], [class*="title" i], [class*="company" i] {
        overflow: visible !important;
        text-overflow: clip !important;
        max-width: none !important;
        white-space: normal !important;
      }
    `;

    function injectIntoShadow(root){
      if(!root || root.__polisFixApplied) return false;
      var style = document.createElement('style');
      style.textContent = overrideCSS;
      root.appendChild(style);
      root.__polisFixApplied = true;
      return true;
    }

    function tryFix(){
      var applied = false;
      document.querySelectorAll('*').forEach(function(el){
        if(el.shadowRoot){
          if(injectIntoShadow(el.shadowRoot)) applied = true;
          // ищем и вложенные shadow root на случай вложенных компонентов
          el.shadowRoot.querySelectorAll('*').forEach(function(inner){
            if(inner.shadowRoot){
              if(injectIntoShadow(inner.shadowRoot)) applied = true;
            }
          });
        }
      });
      return applied;
    }

    var tries = 0;
    var iv = setInterval(function(){
      tryFix();
      tries++;
      if(tries > 40) clearInterval(iv); // пробуем ~20 секунд, пока виджет прогружается
    }, 500);
  })();
</script>
